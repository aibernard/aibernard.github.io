# Butterfly 5.6.0 项目级配置
# 官方文档：https://butterfly.js.org/

nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-user

code_blocks:
  theme: light
  macStyle: true
  height_limit: 500
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

social:
  fab fa-github: https://github.com/aibernard || GitHub || '#24292f'

favicon: /img/favicon.svg

avatar:
  img: /img/avatar.svg
  effect: true

# 参考站采用无大横幅的内容优先布局
disable_top_img: true
index_img: false
archive_img: false
tag_img: false
category_img: false
default_top_img: false
footer_img: false

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - /img/covers/aurora.svg
    - /img/covers/lagoon.svg
    - /img/covers/sunrise.svg

error_img:
  flink: /img/cover-fallback.svg
  post_page: /img/cover-fallback.svg

error_404:
  enable: true
  subtitle: '这里没有你要找的页面'
  background: /img/404.svg

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: created
    date_format: date
    categories: true
    tags: true
    label: true

subtitle:
  enable: false
  effect: true
  source: false

index_layout: 3

index_post_content:
  method: 3
  length: 260

toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: false
  decode: false
  author_href: https://github.com/aibernard
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

reward:
  enable: false

post_edit:
  enable: false

related_post:
  enable: true
  limit: 3
  date_type: created

post_pagination: 2

noticeOutdate:
  enable: true
  style: flat
  limit_day: 365
  position: top
  message_prev: '最后更新于 '
  message_next: ' 天前，文中的信息可能已经发生变化。'

footer:
  nav:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: true
  custom_text: '保持好奇，持续记录。'

aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: '记录技术、思考与生活'
    button:
      enable: true
      icon: fab fa-github
      text: 访问 GitHub
      link: https://github.com/aibernard
  card_announcement:
    enable: true
    content: |
      认真记录每一次探索。

      这个博客用于沉淀技术实践、学习笔记与生活片段。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_newest_comments:
    enable: false
  card_categories:
    enable: true
    limit: 8
    expand: none
    sort_order:
  card_tags:
    enable: true
    limit: 30
    color: false
    orderby: name
    order: 1
    sort_order:
  card_archives:
    enable: false
  card_post_series:
    enable: false
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime_date: '10/25/2026 00:00'

readmode: true

darkmode:
  enable: true
  button: true
  autoChangeMode: 1
  start: 18
  end: 6

rightside_scroll_percent: true
rightside_config_animation: true

anchor:
  auto_update: true
  click_to_scroll: true

copy:
  enable: true
  copyright:
    enable: false
    limit_count: 150

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

search:
  use: local_search
  placeholder: 搜索文章...
  local_search:
    preload: true
    top_n_per_article: 2
    unescape: false
    pagination:
      enable: true
      hitsPerPage: 6
    CDN:

share:
  use:

comments:
  use:
  text: true
  lazyload: true

theme_color:
  enable: true
  main: '#49b1f5'
  paginator: '#00c4b6'
  button_hover: '#ff7242'
  text_selection: '#00c4b6'
  link_color: '#2580b8'
  meta_color: '#858585'
  hr_color: '#a4d8fa'
  code_foreground: '#f47466'
  code_background: 'rgba(27, 31, 35, 0.05)'
  toc_color: '#00c4b6'
  blockquote_padding_color: '#49b1f5'
  blockquote_background_color: '#49b1f5'
  scrollbar_color: '#49b1f5'
  meta_theme_color_light: '#ffffff'
  meta_theme_color_dark: '#0d0d0d'

category_ui: index
tag_ui: index
rounded_corners_ui: true
text_align_justify: false

mask:
  header: true
  footer: true

preloader:
  enable: false

enter_transitions: true
display_mode: light

beautify:
  enable: true
  field: post
  title_prefix_icon: '\f0da'
  title_prefix_icon_color: '#49b1f5'

font:
  global_font_size: 16px
  code_font_size: 14px
  font_family: '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif'
  code_font_family: '"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace'

blog_title_font:
  font_link:
  font_family: '"Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif'

hr_icon:
  enable: true

activate_power_mode:
  enable: false

fireworks:
  enable: false

click_heart:
  enable: false

clickShowText:
  enable: false

lightbox: fancybox

pjax:
  enable: false

instantpage: true

lazyload:
  enable: true
  native: true
  field: site
  placeholder: /img/cover-fallback.svg
  blur: false

Open_Graph_meta:
  enable: true

structured_data:
  enable: true

css_prefix: true

inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - <script src="/js/custom.js" defer></script>

CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true
